    <script>
      // WebMCP is experimental and feature-detected; browsers without the API are unaffected.
      (function () {
        var modelContext = navigator.modelContext;
        if (!modelContext || typeof modelContext.registerTool !== 'function') return;
        try {
          modelContext.registerTool({
            name: 'search_kemet_spirit_excursions',
            description: 'Search Kemet Spirit published Red Sea excursions. Read-only; returns published tour titles, summaries, prices and detail URLs.',
            inputSchema: {
              type: 'object',
              properties: {
                search: { type: 'string', description: 'Optional words to match against published excursion titles and descriptions.' },
                limit: { type: 'integer', minimum: 1, maximum: 20, default: 10 }
              },
              additionalProperties: false
            },
            execute: async function (input) {
              var limit = Number(input && input.limit);
              params.set('limit', String(Number.isInteger(limit) ? Math.max(1, Math.min(20, limit)) : 10));
              var response = await fetch('/mcp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  id: 'webmcp-search',
                  method: 'tools/call',
                  params: {
                    name: 'search_published_excursions',
                    arguments: {
                      query: input && typeof input.search === 'string' ? input.search.slice(0, 120) : '',
                      limit: Number.isInteger(limit) ? Math.max(1, Math.min(20, limit)) : 10
                    }
                  }
                })
              });
              if (!response.ok) throw new Error('Excursion search is temporarily unavailable.');
              var payload = await response.json();
              if (payload.error || !payload.result) throw new Error('Excursion search is temporarily unavailable.');
              return payload.result;
            }
          });
        } catch (error) {
          console.warn('[WebMCP] Tool registration unavailable:', error);
        }
      })();
    </script>
