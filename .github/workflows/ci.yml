name: CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build production assets and server
        run: npm run build

  database:
    name: Supabase migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply the complete migration history to a clean database
        run: supabase db reset

      - name: Run pgTAP database security tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
