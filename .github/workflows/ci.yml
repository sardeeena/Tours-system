name: CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
      - "fix/**"
      - "i18n/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Audit all dependencies and enforce the documented development-only exception
        run: |
          npm audit --include=dev --json > dependency-audit.json || true
          node scripts/check_dependency_audit.mjs dependency-audit.json
          npm audit --omit=dev --audit-level=low



      - name: Validate first-party PWA assets
        run: |
          node --check public/sw.js
          node -e 'JSON.parse(require("fs").readFileSync("public/manifest.webmanifest", "utf8")); console.log("PWA manifest JSON is valid")'

      - name: Enforce canonical website branding
        run: npm run test:brand-identity

      - name: Verify branded email templates and booking ticket renderer
        run: npm run test:comm

      - name: Verify toast, responsive modal and booking ticket UX
        run: npm run test:ui-feedback

      - name: Verify CRM task and follow-up persistence integrity
        run: npm run test:crm-task-persistence

      - name: Verify CRM inquiry persistence integrity
        run: npm run test:crm-inquiry-persistence

      - name: Verify admin navigation, responsive drawer and live-site shortcut
        run: npm run test:admin-navigation

      - name: Verify every admin tab and sidebar destination
        run: npm run test:admin-module-coverage

      - name: Verify admin production data connections
        run: npm run test:admin-data-connections

      - name: Verify isolated admin authorization and error handling
        run: npm run test:admin

      - name: Verify abuse prevention and rate limits
        run: npm run test:abuse

      - name: Verify password recovery flows
        run: npm run test:recovery

      - name: Verify dynamic experience and destination data
        run: npm run test:experiences-destinations

      - name: Verify phase 6.2 dynamic audit regressions
        run: npm run test:audit-6-2

      - name: Verify phase 6.3 staging regressions
        run: npm run test:staging-6-3

      - name: Verify phase 7 admin operations
        run: npm run test:admin-ops-7

      - name: Verify phase 8 finance and workflow regressions
        run: npm run test:phase-8

      - name: Verify schema parity
        run: npm run test:parity

      - name: Verify audit and analytics privacy boundaries
        run: npm run test:audit-analytics-boundaries

      - name: Verify persistent CRM inquiry staff assignments
        run: npm run test:crm-inquiry-staff-assignment

      - name: Verify atomic CRM inquiry conversion
        run: npm run test:crm-inquiry-conversion-atomicity

      - name: Verify project boundary and retired migration workflow safety
        run: npm run test:project-boundaries

      - name: Verify automation event persistence and acknowledgement
        run: npm run test:automation-persistence

      - name: Type-check
        run: npm run lint

      - name: Build production assets and server
        run: npm run build

      - name: Verify communication provider security and validation
        run: npm run test:comm

      - name: Verify WhatsApp consent and Meta template boundaries
        run: npm run test:whatsapp-compliance

      - name: Verify staff WhatsApp consent capture boundaries
        run: npm run test:whatsapp-consent-capture

      - name: Verify Meta WhatsApp delivery webhook security and idempotency
        run: npm run test:whatsapp-webhook

      - name: Verify server API authorization uses normalized RBAC permissions
        run: npm run test:server-rbac

      - name: Verify server API access matrix and route authorization boundaries
        run: npm run test:server-api-access-matrix

      - name: Verify normalized RBAC authority in client authorization gates
        run: npm run test:normalized-rbac-client-boundary

      - name: Verify coupon administration requires content permissions
        run: npm run test:coupon-rbac

      - name: Verify departure slot capacity normalization fails closed
        run: npm run test:departure-slots

      - name: Verify secure customer booking lookup RPC contract
        run: npm run test:booking-lookup-rpc

      - name: Verify customer profile persistence reports database write failures
        run: npm run test:customer-profile-persistence

      - name: Verify customer cancellation feedback and notification retry safety
        run: npm run test:booking-cancellation-feedback

      - name: Verify private and shared tour price display consistency
        run: npm run test:tour-pricing

      - name: Verify booking identifier and production fallback behavior
        run: npm run test:booking

      - name: Verify strict tour-specific pickup mapping policy
        run: npm run test:pickup-policy

      - name: Verify booking payment status is ledger-authoritative
        run: npm run test:booking-finance-boundary

      - name: Verify finance dashboards use settled payments and processed refunds
        run: npm run test:finance-reporting
      - name: Verify legal billing settings and explicit invoice issuance
        run: npm run test:finance-company-billing

      - name: Validate catalogue source and read-only import safety
        run: npm run test:catalogue

      - name: Verify public catalogue fails closed without sample data
        run: npm run test:public-catalogue

      - name: Verify migration history filenames and project identity
        run: npm run test:migration-history

      - name: Verify Supabase project isolation
        run: npm run test:supabase-project
      - name: Verify server and SPA route fallback configuration
        run: npm run test:routes

      - name: Verify public SEO, sitemap and AI-discovery integrity
        run: npm run test:public-seo-content

      - name: Verify public discovery routes, filtering and failure states
        run: npm run test:public-discovery

      - name: Verify read-only MCP protocol and tool boundaries
        run: npm run test:mcp-protocol

      - name: Verify SEO/GEO sitemap and structured-data integrity
        run: npm run test:seo-geo

      - name: Verify locale routing, publication gates and booking language persistence
        run: npm run test:localization-foundation

      - name: Verify safe multilingual translation draft tooling
        run: npm run test:translation-drafts

      - name: Verify private customer UI localization extraction and runtime transform
        run: npm run test:private-ui-localization

      - name: Upload extracted private customer UI source catalog for translation audit
        uses: actions/upload-artifact@v6
        with:
          name: private-ui-source-catalog
          path: src/i18n/privateUiCatalog.generated.ts
          if-no-files-found: error

      - name: Run French content draft coverage and catalogue parity
        run: npm run test:french-content-drafts

      - name: Verify Dutch review bundle coverage and publication gates
        run: npm run test:dutch-content-drafts

      - name: Verify French rollout dictionary completeness and publication gates
        run: npm run test:french-rollout

      - name: Check live-source validation credentials
        id: french-source-credentials
        env:
          SUPABASE_URL: https://uvtbtpxtrrmaublrztgv.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live French, Dutch and Polish source-checksum dry run skipped: expected read-only Supabase URL/service-key Actions secrets are not configured."
          fi

      - name: Validate French, Dutch and Polish import bundles against live Supabase sources (read-only)
        if: steps.french-source-credentials.outputs.available == 'true'
        env:
          SUPABASE_URL: https://uvtbtpxtrrmaublrztgv.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm run translations:export -- ./translation-source.json
          npm run translations:assemble-fr -- ./translation-source.json ./translations/fr/french-import-bundle.review-draft.json
          npm run translations:import -- ./translations/fr/french-import-bundle.review-draft.json
          npm run translations:assemble-nl -- ./translation-source.json ./translations/nl/dutch-import-bundle.review-draft.json
          npm run translations:import -- ./translations/nl/dutch-import-bundle.review-draft.json
          npm run translations:assemble-pl -- ./translation-source.json ./translations/pl/polish-import-bundle.review-draft.json
          npm run translations:import -- ./translations/pl/polish-import-bundle.review-draft.json

      - name: Verify WhatsApp locale mapping and safe fallback
        run: npm run test:whatsapp-locale-mapping

      - name: Verify admin authentication and role provisioning security
        run: npm run test:security

      - name: Verify superadmin technical center security boundaries
        run: npm run test:technical

      - name: Verify Vite and its plugins are build-only dependencies
        run: npm run test:source-content-corrections

      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Verify Hostinger production build lifecycle
        env:
          NODE_ENV: production
        run: |
          npm run build
          npm ls --omit=dev --depth=0
          npm audit --omit=dev --audit-level=low

  database:
    name: Supabase migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        id: setup-supabase-cli
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply the complete migration history to a clean database
        run: supabase db reset

      - name: Run pgTAP database security tests
        run: supabase test db

      - name: Verify simultaneous bookings cannot oversell a departure
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          node scripts/test_booking_concurrency.mjs

      - name: Stop local Supabase stack
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop --no-backup
