name: Migrate KemetSpirit data to AwesomeAdventure

on:
  workflow_dispatch:
    inputs:
      confirm_destination:
        description: "Type MIGRATE_TO_AWESOMEADVENTURE to authorize the one-time data restore"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-awesomeadventure-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_destination == 'MIGRATE_TO_AWESOMEADVENTURE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_DB_URL: ${{ secrets.SUPABASE_SOURCE_DB_URL }}
      DESTINATION_DB_URL: ${{ secrets.SUPABASE_DESTINATION_DB_URL }}
      EXPECTED_SOURCE_REF: mktrtoctcjyokclpdeui
      EXPECTED_DESTINATION_REF: uvtbtpxtrrmaublrztgv
    steps:
      - name: Validate protected inputs and destination identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_DB_URL" || { echo "Missing SUPABASE_SOURCE_DB_URL"; exit 1; }
          test -n "$DESTINATION_DB_URL" || { echo "Missing SUPABASE_DESTINATION_DB_URL"; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse, unquote
          def verify(name, ref):
              u = urlparse(os.environ[name])
              user = unquote(u.username or "")
              host = u.hostname or ""
              if u.scheme not in ("postgres", "postgresql"):
                  raise SystemExit(f"{name} must be a PostgreSQL connection string.")
              if ref not in host and not user.endswith("." + ref):
                  raise SystemExit(f"{name} does not identify the approved project ref.")
          verify("SOURCE_DB_URL", os.environ["EXPECTED_SOURCE_REF"])
          verify("DESTINATION_DB_URL", os.environ["EXPECTED_DESTINATION_REF"])
          print("Approved source and destination project identities verified.")
          PY

      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify repository migrations already deployed to destination
        shell: bash
        run: |
          set -euo pipefail

          psql "$SOURCE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select version,name from supabase_migrations.schema_migrations order by version" > source_migrations.txt
          psql "$DESTINATION_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select version,name from supabase_migrations.schema_migrations order by version" > destination_migrations.txt
          diff -u source_migrations.txt destination_migrations.txt || {
            echo "STOP: source and destination migration histories differ."
            exit 1
          }

          psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by table_name" > source_public_tables.txt
          psql "$DESTINATION_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by table_name" > destination_public_tables.txt
          diff -u source_public_tables.txt destination_public_tables.txt

          target_auth_users="$(psql "$DESTINATION_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from auth.users")"
          target_auth_identities="$(psql "$DESTINATION_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from auth.identities")"
          target_objects="$(psql "$DESTINATION_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from storage.objects")"
          source_objects="$(psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from storage.objects")"
          source_vault_secrets="$(psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select count(*) from vault.secrets")"
          source_queue_messages="$(psql "$SOURCE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select (select count(*) from pgmq.q_booking_notifications) + (select count(*) from pgmq.a_booking_notifications)")"

          if [ "$target_auth_users" != "0" ] || [ "$target_auth_identities" != "0" ] || [ "$target_objects" != "0" ]; then
            echo "STOP: target already contains Auth users, identities or Storage objects; refusing to overwrite them."
            exit 1
          fi
          if [ "$source_objects" != "0" ] || [ "$source_vault_secrets" != "0" ] || [ "$source_queue_messages" != "0" ]; then
            echo "STOP: source contains Storage objects, Vault secrets or queue messages that require a separate transfer."
            exit 1
          fi

          psql "$SOURCE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select id,name,public,file_size_limit,coalesce(array_to_string(allowed_mime_types,','),'') from storage.buckets order by id" > source_buckets.txt
          psql "$DESTINATION_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select id,name,public,file_size_limit,coalesce(array_to_string(allowed_mime_types,','),'') from storage.buckets order by id" > destination_buckets.txt
          diff -u source_buckets.txt destination_buckets.txt

          psql "$SOURCE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select tablename,policyname,cmd,roles::text,coalesce(qual,''),coalesce(with_check,'') from pg_policies where schemaname='storage' order by tablename,policyname" > source_storage_policies.txt
          psql "$DESTINATION_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select tablename,policyname,cmd,roles::text,coalesce(qual,''),coalesce(with_check,'') from pg_policies where schemaname='storage' order by tablename,policyname" > destination_storage_policies.txt
          diff -u source_storage_policies.txt destination_storage_policies.txt

          psql "$SOURCE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select schemaname,tablename from pg_publication_tables where pubname='supabase_realtime' order by schemaname,tablename" > source_realtime.txt
          psql "$DESTINATION_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select schemaname,tablename from pg_publication_tables where pubname='supabase_realtime' order by schemaname,tablename" > destination_realtime.txt
          diff -u source_realtime.txt destination_realtime.txt

          echo "Preflight passed: destination schema/migration history is identical; target Auth and Storage objects are empty; bucket, policy and Realtime configuration matches."

      - name: Dump KemetSpirit application data and Auth records
        shell: bash
        run: |
          set -euo pipefail
          pg_dump "$SOURCE_DB_URL" --data-only --schema=public --no-owner --no-privileges --file=public_data.sql
          pg_dump "$SOURCE_DB_URL" --data-only --schema=auth --exclude-table=auth.instances --exclude-table=auth.schema_migrations --no-owner --no-privileges --file=auth_data.sql
          test -s public_data.sql
          test -s auth_data.sql

          cat > truncate_public.sql <<'SQL'
          SELECT
            'TRUNCATE TABLE ' ||
            string_agg(format('%I.%I', table_schema, table_name), ', ') ||
            ' RESTART IDENTITY CASCADE;'
          FROM information_schema.tables
          WHERE table_schema = 'public'
            AND table_type = 'BASE TABLE'
          \gexec
          SQL

      - name: Restore KemetSpirit data into the repository-managed AwesomeAdventure schema
        shell: bash
        run: |
          set -euo pipefail

          psql "$DESTINATION_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS hypopg WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS index_advisor WITH SCHEMA extensions;
          SQL

          # The two optional advisor extensions exist on source but are not enabled on the new project.
          source_advisors="$(psql "$SOURCE_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select extname,extversion from pg_extension where extname in ('hypopg','index_advisor') order by extname")"
          destination_advisors="$(psql "$DESTINATION_DB_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "select extname,extversion from pg_extension where extname in ('hypopg','index_advisor') order by extname")"
          test "$source_advisors" = "$destination_advisors"

          # The target schema/migrations, Storage buckets/policies and Realtime publication
          # already match the source. Replace seeded public rows with the source's exact rows.
          psql "$DESTINATION_DB_URL" -X --single-transaction -v ON_ERROR_STOP=1 \
            --command='SET session_replication_role = replica' \
            --file=truncate_public.sql \
            --file=public_data.sql \
            --file=auth_data.sql \
            --command='SET session_replication_role = origin'

      - name: Verify every public and Auth table row count
        shell: bash
        run: |
          set -euo pipefail

          dump_counts() {
            local db_url="$1"
            local schema="$2"
            local output="$3"
            psql "$db_url" -X -A -t -F '|' -v ON_ERROR_STOP=1 -v schema="$schema" > "$output" <<'SQL'
          SELECT format('SELECT %L, count(*)::bigint FROM %I.%I;', table_name, table_schema, table_name)
          FROM information_schema.tables
          WHERE table_schema = :'schema'
            AND table_type = 'BASE TABLE'
            AND NOT (:'schema' = 'auth' AND table_name IN ('instances', 'schema_migrations'))
          ORDER BY table_name
          \gexec
          SQL
          }

          for schema in public auth; do
            dump_counts "$SOURCE_DB_URL" "$schema" "source_$schema.txt"
            dump_counts "$DESTINATION_DB_URL" "$schema" "destination_$schema.txt"
            diff -u "source_$schema.txt" "destination_$schema.txt"
          done

          psql "$DESTINATION_DB_URL" -X -v ON_ERROR_STOP=1 -c "select (select count(*) from public.profiles) as profiles, (select count(*) from public.destinations) as destinations, (select count(*) from public.categories) as categories, (select count(*) from public.tours) as tours, (select count(*) from public.tour_images) as tour_images, (select count(*) from public.blog_posts) as blog_posts, (select count(*) from public.support_tickets) as support_tickets, (select count(*) from auth.users) as auth_users, (select count(*) from auth.identities) as auth_identities, (select count(*) from storage.buckets) as storage_buckets, (select count(*) from storage.objects) as storage_objects;"

          echo "All public and Auth table row counts match KemetSpirit."
      
      - name: Remove temporary migration dumps
        if: always()
        run: rm -f public_data.sql auth_data.sql truncate_public.sql source_*.txt destination_*.txt
