name: Production availability check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability-check
  cancel-in-progress: false

jobs:
  check:
    name: Check public site and application readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the exact production commit on main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 10 --header 'Cache-Control: no-cache' --header 'Pragma: no-cache' https://awesomeadventure.tours/robots.txt | grep -Fq "# Hostinger-Release-Marker: $GITHUB_SHA"; then
              echo "Production is serving commit $GITHUB_SHA."
              deployed=1
              break
            fi
            echo "Waiting for Hostinger to serve commit $GITHUB_SHA (attempt $attempt/40)..."
            sleep 15
          done
          if [ "$deployed" -ne 1 ]; then
            echo "::error::Production did not serve the exact main commit $GITHUB_SHA within the deployment window."
            exit 1
          fi

      - name: Check homepage responds successfully
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --location --max-time 25 --retry 2 --retry-delay 2 https://awesomeadventure.tours/)"
          if [ "$status" != "200" ]; then
            echo "::error::Homepage returned HTTP $status (expected 200)."
            exit 1
          fi
          echo "Homepage returned HTTP 200."

      - name: Check legal page and SEO discovery endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in /terms /robots.txt /sitemap.xml; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --location --max-time 25 --retry 2 --retry-delay 2 "https://awesomeadventure.tours$path")"
            if [ "$status" != "200" ]; then
              echo "::error::$path returned HTTP $status (expected 200)."
              exit 1
            fi
            echo "$path returned HTTP 200."
          done

          robots="$(curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 2 https://awesomeadventure.tours/robots.txt)"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf '%s' "$robots" | grep -Fq "# Hostinger-Release-Marker: $GITHUB_SHA" || {
              echo "::error::robots.txt does not contain the exact deployed commit marker."
              exit 1
            }
          fi
          printf '%s' "$robots" | grep -Fq 'Sitemap: https://awesomeadventure.tours/sitemap.xml' || {
            echo "::error::robots.txt does not advertise the canonical sitemap."
            exit 1
          }

          sitemap="$(curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 2 https://awesomeadventure.tours/sitemap.xml)"
          printf '%s' "$sitemap" | GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" node -e '
            const fs = require("node:fs");
            const xml = fs.readFileSync(0, "utf8");
            if (!xml.includes("<urlset") && !xml.includes("<sitemapindex")) {
              throw new Error("Sitemap response is not a sitemap XML document.");
            }
            if (!xml.includes("<loc>https://awesomeadventure.tours/</loc>")) {
              throw new Error("Sitemap is missing the canonical homepage URL.");
            }
            if (!xml.includes("<loc>https://awesomeadventure.tours/terms</loc>")) {
              throw new Error("Sitemap is missing the published Terms page.");
            }
            if (process.env.GITHUB_EVENT_NAME !== "pull_request" && xml.includes("<loc>https://awesomeadventure.tours/booking</loc>")) {
              throw new Error("Private booking flow must not be included in the public sitemap.");
            }
            const entries = (xml.match(/<(url|sitemap)>/g) || []).length;
            if (entries < 1) throw new Error("Sitemap contains no entries.");
            console.log("Sitemap XML is present with", entries, "entries. Booking exclusion check:", process.env.GITHUB_EVENT_NAME === "pull_request" ? "deferred until deployment" : "enforced.");
          '

      - name: Check application liveness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 2 https://awesomeadventure.tours/api/health)"
          printf '%s' "$body" | node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            if (data.status !== "ok" || !Number.isFinite(data.uptimeSeconds) || data.uptimeSeconds <= 0) {
              throw new Error("Health endpoint did not return a valid live status.");
            }
            console.log("Liveness OK; process uptime seconds:", data.uptimeSeconds);
          '

      - name: Check database-backed application readiness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --max-time 25 --retry 2 --retry-delay 2 https://awesomeadventure.tours/api/health/ready)"
          printf '%s' "$body" | node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            if (data.status !== "ready" || data.checks?.database !== "ok") {
              throw new Error("Application readiness or database check failed.");
            }
            console.log("Readiness OK; database check:", data.checks.database);
          '

      - name: Record check result
        if: success()
        run: |
          {
            echo "## Production availability"
            echo ""
            echo "- Homepage: HTTP 200"
            echo "- Application liveness: passed"
            echo "- Database-backed readiness: passed"
            echo "- Deployed commit: $GITHUB_SHA"
            echo "- Checked at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
