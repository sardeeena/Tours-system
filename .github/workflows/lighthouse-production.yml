name: Production Lighthouse

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lighthouse-production.yml"
      - "public/robots.txt"
      - "server.ts"
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: production-lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Lighthouse mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Update the robots.txt release marker whenever a server/SEO release needs a fresh deployment gate.
      - name: Wait for the Hostinger deployment marker for this release
        shell: bash
        run: |
          set -euo pipefail
          deployed=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 15 https://awesomeadventure.tours/robots.txt | grep -Fq 'Hostinger-Release-Marker: aa-analytics-seo-2026-11-28'; then
              echo "The production release marker is live."
              deployed=1
              break
            fi
            echo "Waiting for Hostinger deployment (attempt ${attempt}/60)..."
            sleep 15
          done
          if [ "${deployed}" -ne 1 ]; then
            echo "The production release marker did not appear within 15 minutes." >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Chrome
        run: google-chrome --version

      - name: Install pinned Lighthouse
        run: npm install --global lighthouse@13.6.0

      - name: Preflight representative production pages
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          declare -A pages=(
            [home]="https://awesomeadventure.tours/"
            [terms]="https://awesomeadventure.tours/terms"
            [tour]="https://awesomeadventure.tours/excursions/sharm-super-safari-atv-camel-stargazing-bbq-dinner"
          )
          blocked=0
          printf 'page\thttp_status\tfinal_url\n' > lighthouse-reports/http-preflight.tsv
          for page in home terms tour; do
            url="${pages[${page}]}"
            result="$(curl --location --silent --show-error --max-time 30 \
              --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36' \
              --output /dev/null --write-out '%{http_code}\t%{url_effective}' "${url}" 2> "lighthouse-reports/${page}-curl.log" || true)"
            status="${result%%$'\t'*}"
            final_url="${result#*$'\t'}"
            printf '%s\t%s\t%s\n' "${page}" "${status:-000}" "${final_url:-unavailable}" >> lighthouse-reports/http-preflight.tsv
            echo "${page}: HTTP ${status:-000}"
            if [ "${status}" = "403" ] || [ "${status}" = "429" ]; then
              blocked=1
            elif [ "${status}" != "200" ]; then
              cat "lighthouse-reports/${page}-curl.log"
              echo "Unexpected production response for ${page}: HTTP ${status:-000}" >&2
              exit 1
            fi
          done
          echo "blocked=${blocked}" >> "${GITHUB_OUTPUT}"
          if [ "${blocked}" -eq 1 ]; then
            echo "::warning::Hostinger/CDN returned 403 or 429 to the GitHub-hosted audit runner. Lighthouse is skipped rather than weakening production bot protection."
          fi

      - name: Run representative production audits
        if: steps.preflight.outputs.blocked != '1'
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          declare -A pages=(
            [home]="https://awesomeadventure.tours/"
            [terms]="https://awesomeadventure.tours/terms"
            [tour]="https://awesomeadventure.tours/excursions/sharm-super-safari-atv-camel-stargazing-bbq-dinner"
          )
          blocked=0
          for page in home terms tour; do
            url="${pages[${page}]}"
            for device in mobile desktop; do
              echo "Running Lighthouse: ${page} (${device})"
              log="lighthouse-reports/${page}-${device}.log"
              args=(
                "${url}"
                "--only-categories=performance,accessibility,best-practices,seo"
                "--output=json"
                "--output-path=lighthouse-reports/${page}-${device}.json"
                "--quiet"
                "--chrome-flags=--headless --no-sandbox --disable-dev-shm-usage"
              )
              if [ "${device}" = "desktop" ]; then args+=("--preset=desktop"); fi
              if lighthouse "${args[@]}" > "${log}" 2>&1; then
                cat "${log}"
              else
                code=$?
                cat "${log}"
                if grep -Eq 'Status code: (403|429)' "${log}"; then
                  blocked=1
                  echo "::warning::The production edge blocked the Lighthouse browser request for ${page} (${device})."
                  break 2
                fi
                exit "${code}"
              fi
              sleep 15
            done
          done
          echo "blocked=${blocked}" >> "${GITHUB_OUTPUT}"
          if [ "${blocked}" -eq 1 ]; then
            echo "::warning::Production edge protection blocked the Lighthouse browser. No security controls were bypassed."
          fi

      - name: Print Lighthouse score and Core Web Vitals summary
        if: always()
        env:
          EDGE_BLOCKED: ${{ steps.preflight.outputs.blocked == '1' || steps.audit.outputs.blocked == '1' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'lighthouse-reports';
          const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((file) => file.endsWith('.json')).sort() : [];
          const edgeBlocked = process.env.EDGE_BLOCKED === 'true';
          const preflight = fs.existsSync(path.join(dir, 'http-preflight.tsv'))
            ? fs.readFileSync(path.join(dir, 'http-preflight.tsv'), 'utf8')
            : '';
          if (preflight) console.log('\nProduction HTTP preflight:\n' + preflight);
          if (files.length === 0) {
            console.log('No Lighthouse report was produced. Check the preflight and per-page logs; a 403/429 from the production edge is reported as blocked, not as a performance score.');
            if (preflight && /\t(403|429)\t/.test(preflight)) {
              console.log('Result: BLOCKED BY PRODUCTION EDGE — Lighthouse scores are unavailable.');
              process.exit(0);
            }
            console.error('No Lighthouse reports were produced and no edge block was detected.');
            process.exit(1);
          }
          if (edgeBlocked) console.log('Warning: The production edge blocked at least one browser audit; scores below are partial only.');
          const pct = (value) => value == null ? 'n/a' : String(Math.round(value * 100));
          const ms = (value) => value == null ? 'n/a' : String(Math.round(value));
          console.log('| Page | Device | Performance | Accessibility | Best practices | SEO | LCP ms | CLS | TBT ms | TTFB ms |');
          console.log('|---|---|---:|---:|---:|---:|---:|---:|---:|---:|');
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            const audits = report.audits || {};
            const categories = report.categories || {};
            console.log([
              file.replace(/-(mobile|desktop)\.json$/, ''),
              file.includes('-desktop') ? 'desktop' : 'mobile',
              pct(categories.performance?.score),
              pct(categories.accessibility?.score),
              pct(categories['best-practices']?.score),
              pct(categories.seo?.score),
              ms(audits['largest-contentful-paint']?.numericValue),
              audits['cumulative-layout-shift']?.numericValue?.toFixed(3) ?? 'n/a',
              ms(audits['total-blocking-time']?.numericValue),
              ms(audits['server-response-time']?.numericValue),
            ].join(' | ').replace(/^|$/g, '|'));
          }
          NODE

      - name: Upload Lighthouse diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awesome-adventure-lighthouse-reports
          path: lighthouse-reports/**
          if-no-files-found: warn
          retention-days: 14
